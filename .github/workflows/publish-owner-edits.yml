name: Publish Owner Edits

on:
  push:
    branches:
      - main
    paths:
      - "data/latest_briefing.json"
      - "data/archive/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: complete-transportation-briefing
  cancel-in-progress: false

jobs:
  publish-owner-edit:
    if: startsWith(github.event.head_commit.message, 'Owner edit news edition ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate the owner-edited edition
        run: python owner_edit_validation.py data/latest_briefing.json

      - name: Build the public news archive
        run: python public_site.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish the public site
        id: deployment
        uses: actions/deploy-pages@v4
