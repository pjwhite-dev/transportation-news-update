name: Publish Transportation News Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "coverage_history.py"
      - "news_engine.py"
      - "public_site.py"
      - "market_watch.py"
      - "data/market.json"
      - "site_assets/**"
      - "data/archive/**"
      - "data/latest_briefing.json"
      - "validation_gates.py"
      - "summary_chain.py"
      - "tracker/**"
      - ".github/workflows/publish-news-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: transportation-news-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'Owner edit news edition ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gate and tracker regression tests
        run: >-
          python -m unittest tests.test_validation_gates
          tests.test_regulatory_tracker tests.test_ai_providers tests.test_url_resolver
          tests.test_alerts tests.test_site_design tests.test_non_article_filter tests.test_summary_chain tests.test_market_watch tests.test_self_heal tests.test_doctor tests.test_doctor_auto tests.test_editorial_quality tests.test_edition_preflight tests.test_story_selection tests.test_round2_1029
          tests.test_news_engine tests.test_automated_briefing tests.test_public_site tests.test_master_briefing tests.test_newsroom_live

      - name: Re-validate the edition (hard gates)
        # The reasons are echoed as annotations so a failure e-mail/Checks page says what failed, not just "exit code 1".
        run: |
          set +e
          python automated_briefing.py --validate-only data/latest_briefing.json > validate.out 2> validate.err
          status=$?
          cat validate.out validate.err
          if [ "$status" -ne 0 ]; then
            grep -E '^(- |ValueError|Traceback| *File )' validate.err | head -20 | while IFS= read -r line; do echo "::error title=Gate failure::${line:0:400}"; done
            exit "$status"
          fi

      - name: Build the public news archive
        run: python public_site.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish the public site
        id: deployment
        uses: actions/deploy-pages@v4
