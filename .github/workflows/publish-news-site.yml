name: Publish Transportation News Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "coverage_history.py"
      - "public_site.py"
      - "data/archive/**"
      - "data/latest_briefing.json"
      - ".github/workflows/publish-news-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: transportation-news-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the public news archive
        run: python public_site.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish the public site
        id: deployment
        uses: actions/deploy-pages@v4
