# Live site settings (live_service.py). Times in minutes unless named otherwise.

site:
  # Owner has not picked a new name yet (2026-10-30); the current site name stays until they do.
  name: "Advanced Transportation Update"
  live_label: "Live"
  tagline: "Updates itself around the clock. New stories appear within minutes, each summarized by AI and linked to its source."
  path: "live"            # served at news.peterjwhite.org/live/ until the owner approves the cutover
  poll_seconds: 15        # how often a reader's page checks feed.json
  river_hours: 72         # stories older than this leave the page (they stay in the store)
  feed_limit: 300         # newest stories in feed.json; the page shows 25 at a time
  ticker_items: 24

# Topic desks shown to readers. Each of the edition's sections belongs to exactly one desk.
desks:
  - key: policy
    name: "Policy & Regulation"
    sections: ["Federal Policy & Implementation", "Federal Register", "Surface Transportation Reauthorization"]
  - key: drones
    name: "Drones & Airspace"
    sections: ["UAS / Drones", "UTM / Airspace Integration"]
  - key: sec
    name: "Counter-UAS & Security"
    sections: ["Counter-UAS / Airspace Security", "Military UAS", "International Security"]
  - key: air
    name: "Advanced Air"
    sections: ["AAM / eVTOL / Advanced Aviation", "Civil Supersonics / High-Speed Aviation"]
  - key: av
    name: "Autonomous Vehicles"
    sections: ["Autonomous Vehicles"]
  - key: rail
    name: "Rail"
    sections: ["Advanced Rail / High-Speed Rail"]
  - key: robot
    name: "Robotics & Uncrewed"
    sections: ["Robotics", "UxS / Maritime / Ground Robotics", "Other Advanced Transportation"]

wire:
  window_hours: 36          # ignore feed entries older than this on first sight
  google_min_gap_seconds: 30  # Google News: at most one query every 30 s (71 queries, each about every 36 min)
  google_max_gap_seconds: 300
  federal_register_every: 15
  searxng_every: 0          # off: in the first real sweep 31 of its 86 results passed the reading step, nearly all
                            # market-research, LinkedIn and stock-chatter pages (2026-10-30). The edition keeps it.
  official_every: 5         # NASA and DoD feeds
  agency_search_every: 10   # FAA, DOT and White House: their feeds refuse us, so Google News site:faa.gov etc.
  trade_every: 10
  rest_after_failures: 3
  deny_hosts: [linkedin.com, stocktwits.com, mordorintelligence.com, facebook.com, x.com, twitter.com, youtube.com, reddit.com]
  rest_minutes: [5, 15, 60]
  official_feeds_from: web_discovery.OFFICIAL_FEEDS and OFFICIAL_SITE_SEARCHES
  trade_feeds:
    DroneLife: "https://dronelife.com/feed/"
    DroneDJ: "https://dronedj.com/feed/"
    sUAS News: "https://www.suasnews.com/feed/"
    DroneXL: "https://dronexl.co/feed.xml"
    Unmanned Airspace: "https://www.unmannedairspace.info/feed/"
    The Robot Report: "https://www.therobotreport.com/feed/"
    eVTOL Insights: "https://evtolinsights.com/feed/"
    FLYING Magazine: "https://www.flyingmag.com/feed/"
    Railway Gazette International: "https://www.railwaygazette.com/feed/"
    FreightWaves: "https://www.freightwaves.com/news/feed"
    Transport Topics: "https://www.ttnews.com/rss.xml"
    Breaking Defense: "https://breakingdefense.com/feed/"
    Defense News: "https://www.defensenews.com/feed/"
    The War Zone: "https://www.thedrive.com/feed"

desk:
  parallel_stories: 1       # model calls at once; matches OLLAMA_NUM_PARALLEL=1 (one slot already writes about
                            # 1,000 first passes an hour; more slots multiply the edition's 32k context memory)
  budgets_seconds:          # per story per step, including a model load: writer and checker do not fit on the
    read: 30                #   24 GB card together, so each switch reloads one (about a minute before the first word)
    first_pass: 150
    verify: 300
    score: 240
  verify_every: 10          # slow lane wakes this often, or sooner when 6 stories are waiting
  verify_batch: 6
  first_pass_wait: 20       # a story waiting this long for the writer goes up as a headline instead
  similar_title_overlap: 0.8
  writer_model: "qwen3.8:27b-q4_K_M"
  fallback_model: "qwen3.6:27b-q4_K_M"   # the installed tag (live_service checks every model at start)
  verifier_model: "gemma4:31b"

market:
  every_minutes: 5          # Finnhub watchlist (market_watch.WATCHLIST) while NYSE is open; once after each close
  extra:                    # live page only, after the edition's list (the free plan allows 60 calls a minute)
    - [TSLA, Tesla, Autonomous vehicles]
    - [UBER, Uber Technologies, Autonomous vehicles]
    - [AUR, Aurora Innovation, Autonomous vehicles]
    - [MBLY, Mobileye, Autonomous vehicles]
    - [NSC, Norfolk Southern, Rail & freight]
    - [WAB, Wabtec, Rail & freight]
    - [AAL, American Airlines, Airlines]
    - [LUV, Southwest Airlines, Airlines]
    - [AVAV, AeroVironment, Drones & defense]
    - [KTOS, Kratos Defense, Drones & defense]
    - [EH, EHang, eVTOL]
    - [EVEX, Eve Holding, eVTOL]
  output: ".runtime/live_site/market.json"

override:                   # the owner's headline override, requested from news.peterjwhite.org/login/
  repo: "pjwhite-dev/transportation-news-update"
  owner: "pjwhite-dev"        # only issues this GitHub account opens are applied
  every_seconds: 60
  max_request_age_hours: 6

push:                       # feed.json to the live-feed branch, read by the public page from GitHub
  enabled: true
  worktree: "C:/newsroom/.wt/live-feed"
  min_seconds: 180          # at most this often when stories change
  heartbeat_seconds: 600    # at least this often, so the page can tell when updates have stopped

publish:
  every_seconds: 15         # feed.json is rewritten at most this often, only when something changed
  output: ".runtime/live_site/out"

doctor:
  heartbeat_seconds: 30
  silent_after_seconds: 600  # longer than the slowest step (a 5-minute check)
  lite_queue_minutes: 30    # verify queue older than this: LITE (first pass keeps flowing, lead holds)
  writer_restarts: 2
  model_stall_seconds: 120  # no output for this long: the call fails (covers a model load after a switch)
  frozen_alert_minutes: 15
